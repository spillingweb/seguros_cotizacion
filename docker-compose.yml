services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: seguro_viaje_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - seguro_viaje
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: seguro_viaje_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - seguro_viaje
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: seguro_viaje_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: seguro_viaje
      MYSQL_USER: seguro
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - seguro_viaje
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-useguro", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  seguro_viaje:
    driver: bridge

volumes:
  mysql_data:
